server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Cabeceras de seguridad (la CSP se genera al iniciar con el dominio de la API)
    include /etc/nginx/kardex/seguridad.conf;

    # Archivos con hash en el nombre: caché de un año
    location /assets/ {
        include /etc/nginx/kardex/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Siempre frescos: punto de entrada, configuración y service worker
    location ~ ^/(index\.html|config\.js|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/kardex/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
